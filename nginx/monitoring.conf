# Мониторинг LLM: Grafana + Prometheus (IMP5-7806)
# Порт 80, как у vllm.conf; allow-list идентичен существующим vhost-ам.
server {
    listen 80;
    server_name grafana.ai.lan;

    allow 192.168.1.0/24;               # ПК
    allow 192.168.20.0/24;              # сегмент сервера
    allow 100.64.0.0/10;                # Tailscale
    allow 127.0.0.1;
    allow ::1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Grafana live / websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name prometheus.ai.lan;

    allow 192.168.1.0/24;
    allow 192.168.20.0/24;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
