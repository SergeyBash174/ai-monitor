global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    # 1s вместо общих 15s: /metrics отдаётся за ~10 мс (534 сэмпла).
    # Редкий скрейп = (а) короткие запросы пропадают между снятием,
    # (б) irate считает дельту по интервалу 5-15s и усредняет всплески
    # (префилл за 2s делится на 5s -> занижение в 2.5 раза). С 1s дашбордный
    # irate[3s] даёт честную посекундную скорость.
    scrape_interval: 1s
    static_configs:
      - targets: ["127.0.0.1:8080"]

  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:4000"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/litellm_key

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: nvml
    static_configs:
      - targets: ["127.0.0.1:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
