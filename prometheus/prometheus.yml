global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    # 5s вместо общих 15s: короткие запросы (префилл + генерация успевают
    # уместиться в один интервал) иначе полностью пропадают между скрейпами,
    # и живое состояние/скорость на дашборде дёргаются раз в 15 секунд
    scrape_interval: 5s
    static_configs:
      - targets: ["127.0.0.1:8080"]

  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:4000"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/litellm_key

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: nvml
    static_configs:
      - targets: ["127.0.0.1:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
